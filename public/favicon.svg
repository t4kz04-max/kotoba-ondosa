<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 言葉の温度差：2人の範囲がずれて並ぶ様子（オレンジの塗り＝A、青の斜線＝B）。外部素材は使っていない -->
  <defs>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#dbeafe"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2563eb" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="64" height="64" rx="14" fill="#faf9f5"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#1e293b" stroke-width="3"/>
  <rect x="11" y="17" width="22" height="11" rx="3" fill="#ea580c"/>
  <rect x="27" y="36" width="26" height="11" rx="3" fill="url(#h)" stroke="#2563eb" stroke-width="1.5"/>
</svg>
